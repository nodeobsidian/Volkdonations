<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donor Wall | Volk Donations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      margin: 0;
      color: #222;
    }

    header {
      background: #0b3d2e;
      color: #fff;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .donor-wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .donor-card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      display: flex;
      gap: 14px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .donor-content h4 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
    }

    .donor-content p {
      margin: 0;
      font-size: 14px;
      color: #555;
      line-height: 1.4;
    }

    .submit-box {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .submit-box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .submit-box input,
    .submit-box textarea,
    .submit-box button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .submit-box textarea {
      resize: vertical;
      min-height: 90px;
    }

    .submit-box button {
      background: #0b3d2e;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 16px;
    }

    .submit-box button:hover {
      background: #095f46;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

<header>
  <h1>Donor Wall</h1>
  <p>Messages from people supporting the Volk Donations mission</p>
</header>

<main>

  <section class="donor-wall" id="donorWall">
    <!-- Donor messages injected here -->
  </section>

  <section class="submit-box">
    <h2>Leave a Message of Support</h2>
    <input type="text" id="donorName" placeholder="Your name (optional)" />
    <textarea id="donorMessage" placeholder="Your message"></textarea>
    <button onclick="submitMessage()">Submit Message</button>
  </section>

</main>

<footer>
  © Volk Donations — Building impact through transparency
</footer>

<script>
  const MESSAGES_API = "https://messages.volkdonations.website/donor-wall/messages";
  const SUBMIT_API = "https://submit.volkdonations.website/donor-wall/submit";

  function avatarIcon(type) {
    return type === "female" ? "👩" : "👨";
  }

  async function loadMessages() {
    try {
      const res = await fetch(MESSAGES_API);
      const messages = await res.json();

      const wall = document.getElementById("donorWall");
      wall.innerHTML = "";

      messages.forEach(msg => {
        const card = document.createElement("div");
        card.className = "donor-card";

        card.innerHTML = `
          <div class="avatar">${avatarIcon(msg.avatar)}</div>
          <div class="donor-content">
            <h4>${msg.donor_name}</h4>
            <p>${msg.message}</p>
          </div>
        `;

        wall.appendChild(card);
      });
    } catch (e) {
      console.error("Failed to load donor messages");
    }
  }

  async function submitMessage() {
    const name = document.getElementById("donorName").value;
    const message = document.getElementById("donorMessage").value;

    if (!message.trim()) return;

    await fetch(SUBMIT_API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        donor_name: name,
        message: message
      })
    });

    document.getElementById("donorMessage").value = "";
    loadMessages();
  }

  loadMessages();
</script>

</body>
</html>
